server {
    listen 80;
    listen [::]:80;
    server_name sams.tirallab.page;
    access_log /var/log/sams-nginx/access.log;
    error_log /var/log/sams-nginx/error.log;
    client_max_body_size 1m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/sams-acme;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}
