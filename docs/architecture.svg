<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="SAMS architecture: student, lecturer and administrator use plain HTML CSS JavaScript pages served by Express, which validates requests and stores records in PostgreSQL through Prisma">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0369a1"/></marker></defs><rect width="1000" height="360" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a"><text x="30" y="40" font-size="24" font-weight="bold">SAMS: one attendance workflow, one Express server</text>
<g fill="white" stroke="#94a3b8"><rect x="30" y="90" width="240" height="170" rx="12"/><rect x="365" y="90" width="270" height="170" rx="12"/><rect x="730" y="90" width="240" height="170" rx="12"/></g>
<g text-anchor="middle"><text x="150" y="125" font-size="19" font-weight="bold">Browser</text><text x="150" y="157">Student / Lecturer / Admin</text><text x="150" y="190">HTML + CSS + JavaScript</text><text x="150" y="222" font-size="14">Forms, tables and fetch()</text>
<text x="500" y="125" font-size="19" font-weight="bold">Node.js + Express</text><text x="500" y="157">Serves pages and REST API</text><text x="500" y="190">Auth, validation and attendance</text><text x="500" y="222" font-size="14">JavaScript modules + Prisma</text>
<text x="850" y="125" font-size="19" font-weight="bold">PostgreSQL</text><text x="850" y="157">Users, courses, enrollments</text><text x="850" y="190">Classes, attendance and audit</text><text x="850" y="222" font-size="14">Unique constraints + transactions</text></g>
<path d="M280 175H355 M645 175H720" fill="none" stroke="#0369a1" stroke-width="3" marker-end="url(#arrow)"/>
<text x="30" y="312" font-size="16">Postman/Newman tests the API. The server, not the browser, decides whether attendance is accepted.</text></g></svg>
