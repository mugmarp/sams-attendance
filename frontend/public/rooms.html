<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SAMS · Rooms</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <p id="page-loading" class="page-loading" role="status">Loading SAMS…</p>
    <noscript
      ><p class="page-loading">
        JavaScript is required to use SAMS. Enable it and reload this page.
      </p></noscript
    >
    <header id="site-header" hidden></header>
    <div class="header-inner" id="offline" role="status" hidden>
      You’re offline. Showing saved timetable data where available.
    </div>
    <main hidden data-page-content class="stack">
      <p id="error" class="alert" role="alert" hidden></p>
      <p id="notice" class="notice" role="status" hidden></p>
      <section class="card">
        <h1>Rooms</h1>
        <p>
          Review venue labels before making them available for booking. Location
          and capacity are optional until confirmed.
        </p>
        <label for="room-search">Search rooms</label
        ><input id="room-search" maxlength="100" />
        <label for="room-status">Review status</label
        ><select id="room-status">
          <option value="">All</option>
          <option>REFERENCE</option>
          <option>REVIEWED</option>
          <option>REJECTED</option>
        </select>
        <button id="room-search-button">Search</button>
        <p id="room-count"></p>
        <div id="room-list" class="grid"></div>
        <button id="room-previous">Previous</button
        ><button id="room-next">Next</button>
      </section>
      <section class="card">
        <h2 id="room-form-title">Add a room</h2>
        <form id="room-form" class="stack">
          <label for="room-code">Room code</label
          ><input
            id="room-code"
            required
            pattern="[A-Z0-9-]{2,40}"
            maxlength="40"
          />
          <label for="room-name">Display name</label
          ><input id="room-name" required maxlength="120" />
          <label for="room-campus">Campus</label
          ><input id="room-campus" maxlength="120" />
          <label for="room-building">Building</label
          ><input id="room-building" maxlength="120" />
          <label for="room-type">Type</label
          ><select id="room-type">
            <option>UNSPECIFIED</option>
            <option>LECTURE</option>
            <option>LAB</option>
            <option>TUTORIAL</option>
            <option>CLINICAL</option>
            <option>OTHER</option>
          </select>
          <label for="room-capacity">Confirmed capacity</label
          ><input id="room-capacity" type="number" min="1" max="10000" />
          <label for="room-aliases">Aliases (one per line)</label
          ><textarea id="room-aliases" maxlength="2500"></textarea>
          <label for="room-review">Review status</label
          ><select id="room-review">
            <option>REFERENCE</option>
            <option>REVIEWED</option>
            <option>REJECTED</option>
          </select>
          <label
            ><input id="room-active" type="checkbox" /> Available for
            booking</label
          >
          <label for="room-source">Source or verification note</label
          ><textarea
            id="room-source"
            required
            minlength="5"
            maxlength="1000"
          ></textarea>
          <label for="room-reason">Reason for this change</label
          ><input id="room-reason" required minlength="5" maxlength="500" />
          <button type="submit">Save room</button
          ><button type="button" id="room-new">New room</button>
        </form>
      </section>
    </main>
    <footer>Mbarara University of Science and Technology · SAMS</footer>
    <script type="module" src="/js/rooms.js"></script>
    <script type="module" src="/js/page-loading.js"></script>
  </body>
</html>
