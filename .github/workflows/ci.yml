name: Verify SAMS
on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sams:sams-test-only@localhost:5432/sams_test
      JWT_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      SAMS_E2E_DATABASE_URL: postgresql://sams:sams-test-only@localhost:5432/sams_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sams_test
          POSTGRES_USER: sams
          POSTGRES_PASSWORD: sams-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U sams -d sams_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run prisma:generate --prefix backend
      - run: npm run prisma:deploy --prefix backend
      - run: npm run build --prefix backend
      - run: npm test --prefix backend
      - run: npm run seed --prefix backend
      - run: npm run build --prefix frontend
        env:
          NODE_ENV: production
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start application
        run: |
          npm start --prefix backend > /tmp/sams-api.log 2>&1 &
          npm run preview --prefix frontend -- --host 127.0.0.1 > /tmp/sams-ui.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health && curl -fsS http://localhost:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sams-api.log /tmp/sams-ui.log
          exit 1
      - run: npm run test:e2e --prefix frontend
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: frontend/test-results
      - name: Build containers
        run: |
          docker build -t sams-backend ./backend
          docker build -t sams-frontend ./frontend
